[project]
name = "sum_server"
dynamic = ["version"]
description = "OpenSUM authoritative backend: ownership, inventory, audit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pynacl>=1.5",
    "cryptography>=44.0",
    "httpx>=0.28",
    "structlog>=24.4",
    "slowapi>=0.1.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "uuid-utils>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "polyfactory>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sum_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sum_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101"]

[tool.ruff.lint.isort]
# Pin the first-party root: not-yet-created sub-packages (forward-referenced
# under TYPE_CHECKING) would otherwise be misclassified as third-party.
known-first-party = ["sum_server"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "PLR2004", "PT011", "B017"]
"alembic/*" = ["E501"]
"src/sum_server/**/models.py" = ["RUF012"]  # __mapper_args__ is a SQLAlchemy classmapper directive, not a per-instance mutable default

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]
