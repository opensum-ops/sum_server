<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OpenSUM{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="shell">
        <aside class="sidebar">
            <div class="logo" title="OpenSUM">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                </svg>
            </div>
            <nav class="nav">
                <a href="/hosts" class="nav-item {% if active == 'hosts' %}active{% endif %}" title="Hosts">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                        <rect x="3" y="14" width="18" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="7" cy="7" r="1" fill="currentColor"/>
                        <circle cx="7" cy="17" r="1" fill="currentColor"/>
                    </svg>
                </a>
                <a href="/groups" class="nav-item {% if active == 'groups' %}active{% endif %}" title="Groups">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <circle cx="12" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="6" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="18" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 8.5v3M12 11.5l-4.5 3.5M12 11.5l4.5 3.5" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </a>
                <a href="/audit" class="nav-item {% if active == 'audit' %}active{% endif %}" title="Audit log">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path d="M4 5h16M4 12h16M4 19h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </a>
                <span class="nav-item disabled" title="Plugins (coming soon)">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
                    </svg>
                </span>
                {% if is_admin %}
                <a href="/settings" class="nav-item nav-item-bottom {% if active == 'settings' %}active{% endif %}" title="Settings">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </a>
                {% endif %}
            </nav>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="crumb">{% block crumb %}{% endblock %}</div>
                <div class="user-menu">
                    <span class="user-email">{{ user_email }}</span>
                    <form method="post" action="/logout" class="inline-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button type="submit" class="btn btn-ghost">Sign out</button>
                    </form>
                </div>
            </header>
            <main class="content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
