<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OpenSUM{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="shell">
        <aside class="sidebar">
            <div class="logo" title="OpenSUM">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                </svg>
            </div>
            <nav class="nav">
                <a href="/servers" class="nav-item {% if active == 'servers' %}active{% endif %}" title="Servers">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                        <rect x="3" y="14" width="18" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="7" cy="7" r="1" fill="currentColor"/>
                        <circle cx="7" cy="17" r="1" fill="currentColor"/>
                    </svg>
                </a>
                <a href="/audit" class="nav-item {% if active == 'audit' %}active{% endif %}" title="Audit log">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path d="M4 5h16M4 12h16M4 19h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </a>
                <span class="nav-item disabled" title="Plugins (coming soon)">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
                    </svg>
                </span>
            </nav>
        </aside>
        <div class="main">
            <header class="topbar">
                <div class="crumb">{% block crumb %}{% endblock %}</div>
                <div class="user-menu">
                    <span class="user-email">{{ user_email }}</span>
                    <form method="post" action="/logout" class="inline-form">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button type="submit" class="btn btn-ghost">Sign out</button>
                    </form>
                </div>
            </header>
            <main class="content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
