name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install 3.12

      - name: Install project (frozen)
        run: uv sync --all-extras --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Byte-compile (syntax)
        run: uv run python -m compileall -q src

  typecheck:
    name: mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install 3.12

      - name: Install project (frozen)
        run: uv sync --all-extras --frozen

      - name: mypy
        run: uv run mypy src/sum_server

  test:
    name: Tests (pytest + Postgres testcontainer via Podman)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python
        run: uv python install 3.12

      - name: Install project (frozen)
        run: uv sync --all-extras --frozen

      # Project policy is Podman-only (including CI): expose the Podman API
      # socket and point testcontainers at it via DOCKER_HOST.
      - name: Start Podman API socket
        run: |
          podman system service --time=0 unix:///tmp/podman.sock &
          for _ in $(seq 1 40); do [ -S /tmp/podman.sock ] && break; sleep 0.5; done
          test -S /tmp/podman.sock

      - name: Run test suite
        env:
          DOCKER_HOST: unix:///tmp/podman.sock
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest -q